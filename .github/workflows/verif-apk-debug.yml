name: Verif APK debug

# Verification uniquement : compile un APK debug sur les branches de test.
# Aucun secret, aucun keystore, aucune release, aucun deploiement.
# Declencheur limite aux branches test/** (pas de main, pas de PR, pas de tag).
# Pas de workflow_dispatch : il exigerait que ce fichier existe sur la
# branche par defaut.

on:
  push:
    branches: ['test/**']

permissions:
  contents: read

concurrency:
  group: verif-apk-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versions reprises telles quelles de .github/workflows/build_apk.yml
      # (lignes 13-17). Ce workflow n'installe pas Java explicitement : il
      # s'appuie sur le JDK preinstalle de l'image ubuntu-latest, comme le
      # workflow "Build APK" existant.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: verif-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error

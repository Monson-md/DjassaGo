name: Build APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: caisse-de-poche-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      # Point d'entrée minimal (aucun Hive, aucun service, aucun accès
      # disque) : sert uniquement à distinguer un crash natif d'un crash
      # dans l'initialisation Dart. Voir lib/main_minimal.dart.
      - run: flutter build apk --debug -t lib/main_minimal.dart

      - uses: actions/upload-artifact@v4
        with:
          name: caisse-de-poche-minimal-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: caisse-de-poche-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build_web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - run: flutter build web --release

      - uses: actions/upload-artifact@v4
        with:
          name: caisse-de-poche-web
          path: build/web

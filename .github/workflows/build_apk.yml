name: Build APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: caisse-de-poche-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      # Point d'entrée minimal (aucun Hive, aucun service, aucun accès
      # disque) : sert uniquement à distinguer un crash natif d'un crash
      # dans l'initialisation Dart. Voir lib/main_minimal.dart.
      - run: flutter build apk --debug -t lib/main_minimal.dart

      - uses: actions/upload-artifact@v4
        with:
          name: caisse-de-poche-minimal-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Reconstituer le keystore de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/caisse-de-poche-release.jks"

      - name: Ecrire android/key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/caisse-de-poche-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: caisse-de-poche-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Supprimer le keystore et key.properties
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/caisse-de-poche-release.jks"
          rm -f android/key.properties

  build_web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - run: flutter build web --release

      - uses: actions/upload-artifact@v4
        with:
          name: caisse-de-poche-web
          path: build/web
